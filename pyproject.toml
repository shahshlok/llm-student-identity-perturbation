[project]
name = "llm-student-identity-perturbation"
version = "1.0.0"
description = "Research artifact for an identity-perturbation audit of LLM student models on novice programming data."
authors = [{ name = "Shlok Shah", email = "shlok.shah@ubco.ca" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.2.6",
  "openai>=1.50.0",
  "pandas>=2.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.1",
  "scipy>=1.15.3",
  "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.1.0",
]

[project.scripts]
identity-score-run = "identity_perturbation.prediction_audit.report_full_trace_run_v2:main"
identity-compare-conditions = "identity_perturbation.prediction_audit.compare_condition_reports_v2:main"
identity-narrative-analysis = "identity_perturbation.narrative_audit.narrative_analysis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_perturbation"]
include = ["README.md", "data", "docs"]

[tool.uv]
dev-dependencies = [
  "pytest>=7.0.0",
  "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
